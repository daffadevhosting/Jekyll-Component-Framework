{% comment %}
  Divider Component

  Parameters:
  - variant (string) → subtle, strong
  - class   (string)
{% endcomment %}

<hr class="c-divider{% if include.variant == 'subtle' %} c-divider--subtle{% elsif include.variant == 'strong' %} c-divider--strong{% endif %}{% if include.class %} {{ include.class }}{% endif %}">
