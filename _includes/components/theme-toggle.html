{% comment %}
  Theme Toggle Button
{% endcomment %}

<button
  type="button"
  class="c-button c-button--ghost c-button--icon-only c-button--sm"
  aria-label="Toggle theme"
  data-theme-toggle
>
  <span class="c-theme-icon c-theme-icon--sun" aria-hidden="true">
    {% include icon.html name="sun" size="1.25rem" %}
  </span>
  <span class="c-theme-icon c-theme-icon--moon" aria-hidden="true" hidden>
    {% include icon.html name="moon" size="1.25rem" %}
  </span>
</button>
