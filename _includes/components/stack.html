{% comment %}
  Stack Component

  Parameters:
  - size    (string) → xs, sm, md, lg, xl, 2xl
  - content (string) → HTML content
  - class   (string)
{% endcomment %}

{% assign size = include.size | default: "md" %}

<div class="l-stack l-stack--{{ size }}{% if include.class %} {{ include.class }}{% endif %}">
  {{ include.content }}
</div>
