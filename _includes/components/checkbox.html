{% comment %}
  Checkbox Component
{% endcomment %}

{% assign input_id = include.id | default: include.name %}

<label class="c-checkbox {{ include.class }}">
  <input
    type="checkbox"
    id="{{ input_id }}"
    name="{{ include.name }}"
    value="{{ include.value | default: 'on' }}"
    {% if include.checked %}checked{% endif %}
    {% if include.required %}required{% endif %}
    {% if include.disabled %}disabled{% endif %}
  >
  <span>{{ include.label }}</span>
</label>
