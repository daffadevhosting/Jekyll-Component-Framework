{% comment %}
  Radio Component
{% endcomment %}

{% assign input_id = include.id | default: include.name | append: "-" | append: include.value %}

<label class="c-radio {{ include.class }}">
  <input
    type="radio"
    id="{{ input_id }}"
    name="{{ include.name }}"
    value="{{ include.value }}"
    {% if include.checked %}checked{% endif %}
    {% if include.required %}required{% endif %}
    {% if include.disabled %}disabled{% endif %}
  >
  <span>{{ include.label }}</span>
</label>
