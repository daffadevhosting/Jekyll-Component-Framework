{% comment %}
  Textarea Component
{% endcomment %}

{% assign input_id = include.id | default: include.name %}

<div class="c-form-group {{ include.class }}">
  {% if include.label %}
    <label
      for="{{ input_id }}"
      class="c-label{% if include.required %} c-label--required{% endif %}"
    >
      {{ include.label }}
    </label>
  {% endif %}

  <textarea
    id="{{ input_id }}"
    name="{{ include.name }}"
    class="c-textarea"
    rows="{{ include.rows | default: 4 }}"
    {% if include.placeholder %}placeholder="{{ include.placeholder }}"{% endif %}
    {% if include.required %}required{% endif %}
    {% if include.disabled %}disabled{% endif %}
    {% if include.error %}aria-invalid="true" aria-describedby="{{ input_id }}-error"{% endif %}
  >{{ include.value }}</textarea>

  {% if include.hint and include.error == nil %}
    <p class="c-hint">{{ include.hint }}</p>
  {% endif %}

  {% if include.error %}
    <p class="c-error" id="{{ input_id }}-error" role="alert">{{ include.error }}</p>
  {% endif %}
</div>
