faq:
  title: "Frequently asked questions"
  subtitle: "Everything you need to know about the framework."
  items:
    - title: "Does it work with GitHub Pages?"
      content: "Yes. The framework is fully static and works with GitHub Pages, Cloudflare Pages, Netlify, and any static host."
    - title: "Do I need Node.js or a build step?"
      content: "No. Only Ruby and Bundler are required. SCSS is compiled by Jekyll's built-in sass converter."
    - title: "Can I use it for commercial templates?"
      content: "Yes. The MIT license allows commercial use. The architecture is specifically designed as a foundation for commercial Jekyll themes."
    - title: "How do I customize the brand colors?"
      content: "Override CSS custom properties in your own stylesheet. Change --color-primary and the entire system updates."
      open: true
    - title: "Is JavaScript required?"
      content: "Only for interactive components (modal, tabs, accordion, etc.). Static components work with HTML and CSS alone."

